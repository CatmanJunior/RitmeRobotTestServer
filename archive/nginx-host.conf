# Example for an existing server. Include in Nginx's http context.
# Replace the hostname, certificate paths and both upstream addresses before use.
# Merge with the existing site configuration; do not duplicate its server blocks.
# Requires ngx_http_auth_request_module. Restrict direct access to both upstreams.
upstream ritmerobot_frontend {
    server 127.0.0.1:5173;
}

upstream ritmerobot_backend {
    server 127.0.0.1:8000;
}

map "$status:$uri" $ritmerobot_production_cache {
    default "no-store";
    ~^(200|206|304):/api/ "no-store";
    ~^(200|206|304): "no-cache";
}

# Allow a new login to replace an expired session cookie.
map $uri $ritmerobot_production_cookie {
    default $http_cookie;
    ~^/api/auth/(login|verify)$ "";
}

map $uri $ritmerobot_production_worker_scope {
    default "";
    /legacy-service-worker.js "/";
}

server {
    listen 80;
    server_name ritmerobot.example;
    return 301 https://$host$request_uri;
}

server {
    # HTTPS server configuration
    listen 443 ssl; 
    server_name ritmerobot.example;
    ssl_certificate /etc/letsencrypt/live/ritmerobot.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ritmerobot.example/privkey.pem;

    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control $ritmerobot_production_cache always;
    add_header Service-Worker-Allowed $ritmerobot_production_worker_scope always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $ritmerobot_production_cookie;
    proxy_cookie_flags access_token secure httponly;
    proxy_hide_header Cache-Control;

    location ^~ /api/ {
        proxy_pass http://ritmerobot_backend;
    }

    # Validate the session with the existing backend before serving game files.
    # The backend accepts authenticated staff or player sessions here.
    location = /_ritmerobot_license_check {
        internal;
        proxy_pass http://ritmerobot_backend/api/auth/validate;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 400 = @ritmerobot_production_denied;
    }
    location @ritmerobot_production_denied { return 401; }

    location ~ ^/play/(?:[^/]+\.(?:wasm|pck)|ritme_robot(?:\.[^/]+)*\.js)$ {
        auth_request /_ritmerobot_license_check;
        proxy_pass http://ritmerobot_frontend;
    }

    location = /admin { return 308 /admin/; }
    location ~ ^/admin(?:/[^/.]+)*/?$ {
        rewrite ^ /admin/index.html break;
        proxy_pass http://ritmerobot_frontend;
    }

    location = /play { return 302 /; }
    location = /play/ { return 302 /; }

    # Retire old installed PWA workers while preserving their stored data.
    location ~ ^/(?:play/service-worker|godot/ritme_robot\.service\.worker|ritme_robot\.service\.worker)\.js$ {
        rewrite ^ /legacy-service-worker.js break;
        proxy_pass http://ritmerobot_frontend;
    }

    location / {
        proxy_pass http://ritmerobot_frontend;
    }
}
