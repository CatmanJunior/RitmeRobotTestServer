# Traefik terminates HTTPS and routes API traffic to the test backend.
# The official Nginx image substitutes BACKEND_UPSTREAM at startup.
map "$status:$uri" $ritmerobot_cache_control {
    default "no-store";
    ~^(200|206|304): "no-cache";
}

map $uri $ritmerobot_worker_scope {
    default "";
    /legacy-service-worker.js "/";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;

    # Docker's embedded DNS refreshes the backend address after container restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $ritmerobot_backend "http://${BACKEND_UPSTREAM}";

    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control $ritmerobot_cache_control always;
    add_header Service-Worker-Allowed $ritmerobot_worker_scope always;

    # Traefik sends only login and verification here so expired cookies can be
    # discarded and the backend's session cookie gains Secure and HttpOnly.
    location ~ ^/api/auth/(?:login|verify)$ {
        proxy_pass $ritmerobot_backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Cookie "";
        proxy_cookie_flags access_token secure httponly;
    }

    # All other public API traffic is routed directly to the backend by Traefik.
    location = /api { return 404; }
    location /api/ { return 404; }

    # Only Nginx may call this endpoint to validate a download request.
    location = /_ritmerobot_license_check {
        internal;
        proxy_pass $ritmerobot_backend/api/auth/validate;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_pass_request_headers off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
        proxy_intercept_errors on;
        error_page 400 = @ritmerobot_denied;
    }

    location @ritmerobot_denied { return 401; }

    # Protect engine, soundfont and game-pack downloads. The executable name
    # is ritme_robot; adjust the JavaScript rule if the fetched export differs.
    location ~ ^/play/[^/]+\.(?:wasm|pck)$ {
        auth_request /_ritmerobot_license_check;
        types {
            application/wasm wasm;
            application/octet-stream pck;
        }
        try_files $uri =404;
    }

    location ~ ^/play/ritme_robot(?:\.[^/]+)*\.js$ {
        auth_request /_ritmerobot_license_check;
        try_files $uri =404;
    }

    location = /admin { return 308 /admin/; }
    location ~ ^/admin(?:/[^/.]+)*/?$ { try_files /admin/index.html =404; }
    location /admin/ { try_files $uri =404; }

    location = /play { return 302 /; }
    location = /play/ { return 302 /; }

    # Old installed PWAs still use these URLs to retire their service workers.
    location ~ ^/(?:play/service-worker|godot/ritme_robot\.service\.worker|ritme_robot\.service\.worker)\.js$ {
        rewrite ^ /legacy-service-worker.js last;
    }

    location ~ \.webmanifest$ {
        types { application/manifest+json webmanifest; }
        try_files $uri =404;
    }

    location = / { try_files /index.html =404; }
    location / { try_files $uri =404; }
}
